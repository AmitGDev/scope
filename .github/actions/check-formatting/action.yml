name: 'Check Code Formatting'
description: 'Checks Python and C++ code formatting'

runs:
  using: 'composite'
  steps:
    - name: Check Python formatting
      shell: bash
      run: |
        echo "Checking Python formatting with Ruff..."
        files=$(find . -type f -name "*.py" \
          -not -path "./.git/*" \
          -not -path "./.github/scripts/run-clang-tidy.py" \
          2>/dev/null || true)

        if [ -z "$files" ]; then
          echo "No Python files found to check"
          exit 0
        fi

        if ! ruff format --check $files; then
          echo ""
          echo "Python formatting issues found"
          echo "Run 'ruff format .' to fix"
          exit 1
        fi

        echo "All Python files are properly formatted!"

    - name: Check C++ formatting
      shell: bash
      run: |
        echo "Checking code formatting with clang-format..."
        files=$(find src -name "*.cpp" -o -name "*.hpp" -o -name "*.h" 2>/dev/null || true)

        if [ -z "$files" ]; then
          echo "No source files found to check"
          exit 0
        fi

        # '((issues++))' returns status 1 while issues is 0, which aborts the
        # step under 'bash -e' at the first bad file; arithmetic expansion
        # always succeeds, so every file is checked and the summary prints.
        issues=0
        for file in $files; do
          if ! clang-format --dry-run --Werror "$file" 2>&1; then
            issues=$((issues + 1))
            echo "Formatting issues in: $(basename "$file")"
          fi
        done

        if [ $issues -gt 0 ]; then
          echo ""
          echo "Found formatting issues in $issues file(s)"
          echo "Run 'clang-format -i src/**/*.{cpp,hpp,h}' to fix"
          exit 1
        fi

        echo "All C++ files are properly formatted!"