name: 'Setup Environment'
description: 'Sets up standard CI tools and runs optional project-specific environment setup'

runs:
  using: 'composite'

  steps:
    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        LLVM_VERSION: '23.1.0'
      run: |
        $ErrorActionPreference = 'Stop'

        $ver = $env:LLVM_VERSION
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/LLVM-$ver-win64.msi"
        $msi = "$env:RUNNER_TEMP\LLVM.msi"

        Write-Host "Downloading LLVM $ver..."
        Invoke-WebRequest -Uri $url -OutFile $msi

        Write-Host "Installing LLVM..."
        $proc = Start-Process msiexec.exe `
          -ArgumentList "/i `"$msi`" /quiet /norestart" `
          -Wait `
          -PassThru

        if ($proc.ExitCode -ne 0) {
          Write-Host "msiexec failed with exit code $($proc.ExitCode)" -ForegroundColor Red
          exit 1
        }

        # Add LLVM to PATH for subsequent steps.
        echo "C:\Program Files\LLVM\bin" |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"

    - name: Setup Ninja (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        NINJA_VERSION: '1.13.2'
      run: |
        $ErrorActionPreference = 'Stop'

        $ver = $env:NINJA_VERSION
        $url = "https://github.com/ninja-build/ninja/releases/download/v$ver/ninja-win.zip"
        $zip = "$env:RUNNER_TEMP\ninja.zip"
        $installDir = "$env:RUNNER_TEMP\ninja"

        Write-Host "Downloading Ninja $ver..."
        Invoke-WebRequest -Uri $url -OutFile $zip

        Write-Host "Installing Ninja $ver..."
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        Expand-Archive -Path $zip -DestinationPath $installDir -Force

        echo $installDir |
          Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        $env:PATH = "$installDir;$env:PATH"

    - name: Setup LLVM tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        LLVM_MAJOR: '23'
      run: |
        set -euo pipefail

        # Full LLVM release tarballs bundle clang, lld, lldb, mlir, flang,
        # compiler-rt, libc++, polly, clang-tools-extra, etc. with no way to
        # extract a subset. apt.llvm.org packages each tool separately, so
        # this installs only clang-format and clang-tidy plus their direct
        # deps instead of several GB of unrelated tooling.
        ver="${LLVM_MAJOR}"

        wget -q https://apt.llvm.org/llvm.sh -O "${RUNNER_TEMP}/llvm.sh"
        chmod +x "${RUNNER_TEMP}/llvm.sh"
        sudo "${RUNNER_TEMP}/llvm.sh" "${ver}"

        sudo apt-get install -y -qq -o Dpkg::Use-Pty=0 \
          "clang-format-${ver}" "clang-tidy-${ver}"

        # Downstream steps call the unversioned binary names, so symlink
        # them into a directory on PATH rather than editing every caller.
        bindir="${RUNNER_TEMP}/llvm-bin"
        mkdir -p "${bindir}"
        ln -sf "/usr/bin/clang-format-${ver}" "${bindir}/clang-format"
        ln -sf "/usr/bin/clang-tidy-${ver}" "${bindir}/clang-tidy"
        ln -sf "/usr/bin/clang++-${ver}" "${bindir}/clang++"
        ln -sf "/usr/bin/clang-${ver}" "${bindir}/clang"

        echo "${bindir}" >> "$GITHUB_PATH"
        export PATH="${bindir}:${PATH}"

    - name: Setup Ninja (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        NINJA_VERSION: '1.13.2'
      run: |
        set -euo pipefail

        ver="${NINJA_VERSION}"
        url="https://github.com/ninja-build/ninja/releases/download/v${ver}/ninja-linux.zip"
        zip="${RUNNER_TEMP}/ninja.zip"
        bindir="${RUNNER_TEMP}/ninja-bin"

        echo "Downloading Ninja ${ver}..."
        wget -q "${url}" -O "${zip}"

        echo "Installing Ninja ${ver}..."
        mkdir -p "${bindir}"
        unzip -q -o "${zip}" -d "${bindir}"

        echo "${bindir}" >> "$GITHUB_PATH"
        export PATH="${bindir}:${PATH}"

    - name: Show tool versions (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "=== Tool versions (Windows) ==="
        cl
        clang-format --version
        clang-tidy --version
        Write-Host "Ninja: $(ninja --version)"

    - name: Show tool versions (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        echo "=== Tool versions (Linux) ==="
        clang++ --version
        clang-format --version
        clang-tidy --version
        echo "Ninja: $(ninja --version)"

    - name: Setup project-specific environment (optional)
      shell: python
      run: |
        import os
        import subprocess
        import sys
        from pathlib import Path

        script = (
            Path(os.environ["GITHUB_WORKSPACE"])
            / ".github-ext"
            / "setup_environment.py"
        )

        if not script.is_file():
            print(f"No project-specific extension found: {script}")
            print("Skipping optional extension.")
            sys.exit(0)

        print(f"Running project-specific extension: {script}")
        try:
            subprocess.run([sys.executable, str(script)], check=True)
        except subprocess.CalledProcessError as exc:
            raise RuntimeError(
                f"Project-specific extension failed (exit {exc.returncode}): {script}"
            ) from exc

        print("Project-specific extension completed successfully.")