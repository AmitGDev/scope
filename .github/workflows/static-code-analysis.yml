name: "Static Code Analysis Recipe"

on:
  push:
    branches: ["*"]
    paths-ignore: &ignore_policy
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

  pull_request:
    branches: ["*"]
    paths-ignore: *ignore_policy

  schedule:
    - cron: '0 6 * * 0'

  workflow_dispatch:

jobs:
  process-analysis-config:
    name: Process analysis config
    runs-on: ubuntu-latest

    outputs:
      os: ${{ steps.config.outputs.os }}
      configurations: ${{ steps.config.outputs.configurations }}
      codeql: ${{ steps.config.outputs.codeql }}

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/process-analysis-config
            .github/static-code-analysis.json
            .github-ext/static-code-analysis.json
          sparse-checkout-cone-mode: false

      - name: Process configuration
        id: config
        uses: ./.github/actions/process-analysis-config

  analyze:
    name: Analyze (${{ matrix.os }}, ${{ matrix.config }})
    needs: process-analysis-config
    runs-on: ${{ matrix.os }}

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.process-analysis-config.outputs.os) }}
        config: ${{ fromJSON(needs.process-analysis-config.outputs.configurations) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Check formatting
        uses: ./.github/actions/check-formatting

      - name: Configure CMake
        id: configure
        uses: ./.github/actions/configure-cmake
        with:
          config: ${{ matrix.config }}

      - name: Initialize CodeQL
        if: needs.process-analysis-config.outputs.codeql == '1'
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Build project
        uses: ./.github/actions/build-project
        with:
          config: ${{ matrix.config }}

      - name: Run clang-tidy check
        uses: ./.github/actions/run-clang-tidy
        with:
          build-dir: ${{ steps.configure.outputs.db-dir }}

      - name: Perform CodeQL analysis
        if: needs.process-analysis-config.outputs.codeql == '1'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp/os:${{ matrix.os }}/config:${{ matrix.config }}"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.config }}
          path: |
            **/*.log
            build/**/*.log
          retention-days: 7

      - name: Upload compilation databases
        if: ${{ always() && hashFiles(format('{0}/compile_commands.json', steps.configure.outputs.build-dir)) != '' && hashFiles(format('{0}/compile_commands.json', steps.configure.outputs.db-dir)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: compilation-databases-${{ matrix.os }}-${{ matrix.config }}
          path: |
            ${{ steps.configure.outputs.build-dir }}/compile_commands.json
            ${{ steps.configure.outputs.db-dir }}/compile_commands.json
          retention-days: 7
